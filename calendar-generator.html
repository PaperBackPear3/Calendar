<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Importatore Calendario & Esportatore PDF</title>

  <!-- Librerie Esterne: SheetJS e html2pdf -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --panel-bg: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Layout Principale Responsivo */
    .app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 360px;
      min-width: 320px;
      background: var(--panel-bg);
      border-right: 1px solid var(--border);
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex-shrink: 0;
    }

    /* Correzione Taglio Orizzontale Anteprima */
    .main-preview {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
      overflow-x: auto;
      background-color: #cbd5e1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      min-width: 0;
      width: 100%;
    }

    /* Supporto Schermi Piccoli (Media Query) */
    @media (max-width: 1100px) {
      body {
        overflow: auto;
        height: auto;
      }

      .app-container {
        flex-direction: column;
        height: auto;
        overflow: visible;
      }

      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      .main-preview {
        padding: 15px;
        width: 100%;
      }
    }

    /* Schede Controllo */
    .section-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
    }

    h2 {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 10px;
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 10px;
    }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #475569;
    }

    input,
    select,
    button {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }

    input[type="color"] {
      padding: 2px;
      height: 36px;
      cursor: pointer;
    }

    input[type="file"] {
      background: white;
      font-size: 0.8rem;
    }

    button {
      cursor: pointer;
      background-color: var(--primary);
      color: white;
      border: none;
      font-weight: 600;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    button.secondary {
      background-color: #64748b;
    }

    button.secondary:hover {
      background-color: #475569;
    }

    button.danger {
      background-color: #ef4444;
    }

    button.danger:hover {
      background-color: #dc2626;
    }

    /* Legenda Categorie */
    .sector-legend {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
      max-height: 110px;
      overflow-y: auto;
    }

    .sector-chip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.78rem;
      padding: 4px 8px;
      border-radius: 6px;
      background: white;
      border: 1px solid var(--border);
      font-weight: 500;
    }

    .sector-chip-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sector-color-picker {
      border: none;
      padding: 0;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }

    .sector-color-picker::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    .sector-color-picker::-webkit-color-swatch {
      border: none;
      border-radius: 50%;
    }

    /* Registro Eventi */
    .event-list {
      max-height: 150px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .event-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.8rem;
    }

    .event-info {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }

    .event-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 170px;
    }

    .action-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 0 3px;
      color: #64748b;
    }

    .action-btn.delete:hover {
      color: #ef4444;
    }

    /* Area Anteprima Foglio A4 */
    #pdfContent {
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      max-width: 100%;
    }

    .pdf-page {
      background: white;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      border-radius: 4px;
      box-sizing: border-box;
      padding: 12mm;
      position: relative;
      display: flex;
      flex-direction: column;
      page-break-after: always;
      break-after: page;
      flex-shrink: 0;
    }

    .pdf-page:last-child {
      page-break-after: auto;
      break-after: auto;
    }

    .pdf-page.portrait {
      width: 210mm;
      min-height: 297mm;
    }

    .pdf-page.landscape {
      width: 297mm;
      min-height: 210mm;
    }

    .page-watermark {
      position: absolute;
      top: 3mm;
      right: 5mm;
      font-size: 0.65rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* SPECULAR / LIBRO LAYOUT (PAGINA SINISTRA vs DESTRA) */
    .pdf-page.page-left {
      padding-right: 18mm;
      padding-left: 8mm;
    }

    .pdf-page.page-left .page-watermark {
      left: 6mm;
      right: auto;
    }

    .pdf-page.page-right {
      padding-left: 18mm;
      padding-right: 8mm;
    }

    .pdf-page.page-right .page-watermark {
      right: 6mm;
      left: auto;
    }

    .pdf-page.page-right .list-header-banner {
      flex-direction: row-reverse;
    }

    .pdf-page.page-right .list-event-item {
      flex-direction: row-reverse;
    }

    /* Griglia Mesi Adattiva */
    .months-grid {
      display: grid;
      gap: 8mm;
      width: 100%;
      height: 100%;
      flex: 1;
    }

    /* Stili Grafica Calendario Singolo Mese */
    .month-card {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .month-header {
      text-align: center;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 6px;
      text-transform: uppercase;
      color: #0f172a;
      letter-spacing: 0.5px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-top: 1px solid #cbd5e1;
      border-left: 1px solid #cbd5e1;
      height: 100%;
    }

    .day-header {
      background: #f1f5f9;
      text-align: center;
      font-weight: 700;
      padding: 4px 0;
      font-size: 0.7rem;
      border-right: 1px solid #cbd5e1;
      border-bottom: 1px solid #cbd5e1;
      color: #475569;
    }

    .day-cell {
      border-right: 1px solid #cbd5e1;
      border-bottom: 1px solid #cbd5e1;
      padding: 2px;
      vertical-align: top;
      overflow: hidden;
      background: white;
      min-height: 40px;
    }

    .day-number {
      font-size: 0.65rem;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 2px;
    }

    .event-tag {
      font-size: 0.6rem;
      color: white;
      padding: 1px 3px;
      border-radius: 2px;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
      line-height: 1.1;
    }

    /* Stili Grafica Vista Elenco */
    .list-view-month {
      background: #fff;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .list-header-banner {
      background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
      color: white;
      padding: 6px 12px;
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .list-header-banner .year-badge {
      background: rgba(255, 255, 255, 0.2);
      padding: 1px 6px;
      border-radius: 10px;
      font-size: 0.7rem;
      font-weight: 500;
    }

    .list-events {
      list-style: none;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      overflow-y: auto;
      flex: 1;
    }

    .list-event-item {
      font-size: 0.78rem;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 6px;
      border-radius: 4px;
      background: #f8fafc;
      border: 1px solid #edf2f7;
    }

    .list-day-badge {
      background: #e2e8f0;
      color: #334155;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 3px;
      font-size: 0.7rem;
      min-width: 50px;
      text-align: center;
    }

    .list-event-tag {
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 3px;
      color: white;
      font-size: 0.72rem;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .list-event-sector-sub {
      font-size: 0.62rem;
      opacity: 0.85;
      text-transform: uppercase;
      font-weight: 400;
      margin-left: 6px;
    }

    /* Stili Compatti per Griglie Multi-Mese */
    .pdf-page.compact .month-header {
      font-size: 0.8rem;
      margin-bottom: 2px;
    }

    .pdf-page.compact .day-header {
      font-size: 0.55rem;
      padding: 2px 0;
    }

    .pdf-page.compact .day-cell {
      min-height: 22px;
      padding: 1px;
    }

    .pdf-page.compact .day-number {
      font-size: 0.5rem;
      margin-bottom: 1px;
    }

    .pdf-page.compact .event-tag {
      font-size: 0.48rem;
      padding: 0 2px;
      line-height: 1;
      margin-bottom: 1px;
    }

    .pdf-page.compact .list-header-banner {
      padding: 4px 8px;
      font-size: 0.75rem;
    }

    .pdf-page.compact .list-events {
      padding: 4px;
      gap: 3px;
    }

    .pdf-page.compact .list-event-item {
      padding: 2px 4px;
      font-size: 0.68rem;
      gap: 4px;
    }

    .pdf-page.compact .list-day-badge {
      font-size: 0.6rem;
      padding: 1px 3px;
      min-width: 40px;
    }

    .pdf-page.compact .list-event-tag {
      font-size: 0.65rem;
      padding: 1px 4px;
    }

    @media print {
      .sidebar {
        display: none;
      }

      .main-preview {
        padding: 0;
        background: white;
        overflow: visible;
      }

      .pdf-page {
        box-shadow: none;
        margin: 0;
      }

      .page-watermark {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="app-container">
    <!-- Barra Laterale Controlli -->
    <div class="sidebar">

      <!-- 1. Importa File -->
      <div class="section-card">
        <h2>1. Importa File</h2>
        <div class="form-group">
          <label for="fileInput">File CSV, Excel (.xlsx) o Google Calendar (.ics)</label>
          <input type="file" id="fileInput" accept=".csv, .xlsx, .xls, .ics" onchange="handleFileUpload(event)">
        </div>
        <label style="margin-top:4px; display:block;">Categorie rilevate:</label>
        <div id="sectorLegend" class="sector-legend"></div>
      </div>

      <!-- 2. Anno Calendario (ADATTIVO) -->
      <div class="section-card">
        <h2>2. Anno Calendario</h2>
        <div class="form-group">
          <label for="yearSelect">Filtro Anno / Eventi</label>
          <select id="yearSelect" onchange="updateCalendar()"></select>
        </div>
        <div id="yearInfo" style="font-size:0.75rem; color:#64748b; font-weight:500;"></div>
      </div>

      <!-- 3. Aggiungi / Modifica Evento -->
      <div class="section-card">
        <h2 id="formTitle">3. Aggiungi Evento</h2>
        <form id="eventForm" onsubmit="saveEvent(event)">
          <input type="hidden" id="eventId">
          <div class="form-group">
            <label for="eventTitle">Nome Evento</label>
            <input type="text" id="eventTitle" placeholder="es. Consiglio Diocesano" required>
          </div>
          <div class="form-group">
            <label for="eventDate">Data</label>
            <input type="date" id="eventDate" required>
          </div>
          <div class="form-group">
            <label for="eventSector">Categoria / Settore</label>
            <input type="text" id="eventSector" placeholder="es. ADULTI, GIOVANI">
          </div>
          <div class="form-group">
            <label for="eventColor">Colore Tag</label>
            <input type="color" id="eventColor" value="#2563eb">
          </div>
          <div style="display:flex; gap: 6px;">
            <button type="submit" style="flex:1;">Salva</button>
            <button type="button" class="secondary" onclick="resetForm()">Pulisci</button>
          </div>
        </form>
      </div>

      <!-- 4. Registro Eventi -->
      <div class="section-card">
        <h2>
          Registro Eventi
          <button type="button" class="danger" onclick="clearAllEvents()"
            style="font-size:0.7rem; padding: 2px 6px;">Elimina Tutti</button>
        </h2>
        <div class="event-list" id="eventListContainer"></div>
      </div>

      <!-- 5. Opzioni Esportazione PDF -->
      <div class="section-card">
        <h2>4. Opzioni Export PDF</h2>
        <div class="form-group">
          <label for="viewMode">Formato Vista Mesi</label>
          <select id="viewMode" onchange="updateCalendar()">
            <option value="grid">Griglia Classica</option>
            <option value="list">Vista Elenco Elegante</option>
          </select>
        </div>
        <div class="form-group">
          <label for="monthFilter">Mesi Inclusi</label>
          <select id="monthFilter" onchange="updateCalendar()">
            <option value="all">Tutti i Mesi dell'Anno</option>
            <option value="active" selected>Solo Mesi con Eventi</option>
          </select>
        </div>
        <div class="form-group">
          <label for="pageLayoutOpt">Impaginazione PDF</label>
          <select id="pageLayoutOpt" onchange="updateCalendar()">
            <option value="single" selected>Tutto in 1 Singola Pagina (Griglia Adattiva)</option>
            <option value="dual">2 Pagine Speculari (Libro - Sinistra / Destra)</option>
            <option value="multi">1 Pagina per ogni Mese</option>
          </select>
        </div>
        <div class="form-group">
          <label for="pdfOrientation">Orientamento Foglio</label>
          <select id="pdfOrientation" onchange="updateCalendar()">
            <option value="landscape" selected>Orizzontale (Landscape)</option>
            <option value="portrait">Verticale (Portrait)</option>
          </select>
        </div>
        <button onclick="exportToPDF()"
          style="width: 100%; padding: 10px; background-color: #16a34a; font-size: 0.9rem; margin-top: 4px;">
          Scarica PDF
        </button>
      </div>

    </div>

    <!-- Anteprima Principale Live -->
    <div class="main-preview">
      <div id="pdfContent"></div>
    </div>
  </div>

  <script>
    // Stato dell'applicazione
    let events = [];
    let sectorColors = {};

    const monthNames = ["Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno", "Luglio", "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre"];
    const dayNames = ["Dom", "Lun", "Mar", "Mer", "Gio", "Ven", "Sab"];
    const defaultPalette = ['#2563eb', '#dc2626', '#16a34a', '#d97706', '#9333ea', '#0891b2', '#e11d48', '#4f46e5', '#059669', '#ca8a04'];

    document.addEventListener("DOMContentLoaded", () => {
      updateYearOptions();
      renderEventList();
      updateCalendar();
    });

    function updateYearOptions() {
      const select = document.getElementById('yearSelect');
      const currentValue = select.value;

      const years = [...new Set(events.map(e => e.date.split('-')[0]))].filter(Boolean).sort();
      select.innerHTML = '';

      if (years.length === 0) {
        const currentYear = new Date().getFullYear().toString();
        const opt = document.createElement('option');
        opt.value = currentYear;
        opt.innerText = `Anno ${currentYear}`;
        select.appendChild(opt);
      } else {
        if (years.length > 1) {
          const allOpt = document.createElement('option');
          allOpt.value = 'all_years';
          allOpt.innerText = `Tutti gli Anni (${years.join(', ')})`;
          select.appendChild(allOpt);
        }
        years.forEach(y => {
          const opt = document.createElement('option');
          opt.value = y;
          opt.innerText = `Anno ${y}`;
          select.appendChild(opt);
        });
      }

      if (currentValue && select.querySelector(`option[value="${currentValue}"]`)) {
        select.value = currentValue;
      } else if (years.length > 1) {
        select.value = 'all_years';
      }

      const info = document.getElementById('yearInfo');
      if (info) {
        info.innerText = years.length > 0
          ? `Anni rilevati: ${years.join(', ')}`
          : 'Nessun evento presente';
      }
    }

    // Gestione Caricamento File (ICS, CSV, XLSX)
    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const fileName = file.name.toLowerCase();

      if (fileName.endsWith('.ics')) {
        const reader = new FileReader();
        reader.onload = function (evt) {
          const text = evt.target.result;
          const parsedEvents = parseICS(text);
          if (parsedEvents.length > 0) {
            events = parsedEvents;
            updateYearOptions();
            renderSectorLegend();
            renderEventList();
            updateCalendar();
          } else {
            alert("Nessun evento valido trovato nel file ICS di Google Calendar.");
          }
        };
        reader.readAsText(file);
      } else {
        const reader = new FileReader();
        reader.onload = function (evt) {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: 'array', cellDates: true });

          let importedEvents = [];
          sectorColors = {};
          let paletteIndex = 0;

          workbook.SheetNames.forEach(sheetName => {
            if (sheetName.toLowerCase() === 'summary' || sheetName.toLowerCase() === 'indice') return;

            const sheet = workbook.Sheets[sheetName];
            const jsonRows = XLSX.utils.sheet_to_json(sheet, { defval: '' });

            jsonRows.forEach(row => {
              const title = row.Summary || row.Subject || row.Title || row.Event || row.Name || row.Titolo || row.Oggetto;
              if (!title) return;

              let rawDate = row.Start || row['Start Date'] || row.DTSTART || row.Date || row.Data;
              if (!rawDate) return;

              let formattedDate = parseRawDate(rawDate);
              if (!formattedDate) return;

              let sector = row.Calendar || row.Sector || row.Category || row.Categoria || row.Settore || sheetName;
              if (typeof sector === 'string' && sector.includes('_')) {
                sector = sector.split('_')[0];
              }
              if (!sector) sector = 'Generale';

              if (!sectorColors[sector]) {
                sectorColors[sector] = defaultPalette[paletteIndex % defaultPalette.length];
                paletteIndex++;
              }

              importedEvents.push({
                id: Date.now().toString() + '_' + Math.random().toString(36).substring(2, 6),
                title: String(title).trim(),
                date: formattedDate,
                color: sectorColors[sector],
                sector: sector
              });
            });
          });

          if (importedEvents.length > 0) {
            events = importedEvents;
            updateYearOptions();
            renderSectorLegend();
            renderEventList();
            updateCalendar();
          } else {
            alert("Nessun evento valido trovato nel file caricato.");
          }
        };
        reader.readAsArrayBuffer(file);
      }
    }

    // Parser iCalendar (.ics Google Calendar)
    function parseICS(icsText) {
      const parsedEvents = [];
      sectorColors = {};
      let paletteIndex = 0;

      // Dispiega righe spezzate RFC 5545
      const unfolded = icsText.replace(/\r?\n[ \t]/g, '');
      const vevents = unfolded.split('BEGIN:VEVENT');

      for (let i = 1; i < vevents.length; i++) {
        const block = vevents[i].split('END:VEVENT')[0];
        const lines = block.split(/\r?\n/);

        let summary = '';
        let dtstart = '';
        let category = 'Google Calendar';

        for (let line of lines) {
          if (line.startsWith('SUMMARY:')) {
            summary = line.substring(8).trim();
          } else if (line.startsWith('SUMMARY;')) {
            summary = line.substring(line.indexOf(':') + 1).trim();
          } else if (line.startsWith('DTSTART:') || line.startsWith('DTSTART;')) {
            const val = line.substring(line.indexOf(':') + 1).trim();
            const match = val.match(/(\d{4})(\d{2})(\d{2})/);
            if (match) {
              dtstart = `${match[1]}-${match[2]}-${match[3]}`;
            }
          } else if (line.startsWith('CATEGORIES:')) {
            category = line.substring(11).trim().split(',')[0];
          }
        }

        if (summary && dtstart) {
          if (!sectorColors[category]) {
            sectorColors[category] = defaultPalette[paletteIndex % defaultPalette.length];
            paletteIndex++;
          }

          parsedEvents.push({
            id: Date.now().toString() + '_' + Math.random().toString(36).substring(2, 6),
            title: summary,
            date: dtstart,
            color: sectorColors[category],
            sector: category
          });
        }
      }

      return parsedEvents;
    }

    function parseRawDate(raw) {
      if (raw instanceof Date) {
        return raw.toISOString().split('T')[0];
      }
      if (typeof raw === 'string') {
        const match = raw.match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
        if (match) {
          return `${match[1]}-${String(match[2]).padStart(2, '0')}-${String(match[3]).padStart(2, '0')}`;
        }
        const d = new Date(raw);
        if (!isNaN(d.getTime())) {
          return d.toISOString().split('T')[0];
        }
      }
      return null;
    }

    function renderSectorLegend() {
      const container = document.getElementById('sectorLegend');
      container.innerHTML = '';
      Object.keys(sectorColors).forEach(sec => {
        const chip = document.createElement('div');
        chip.className = 'sector-chip';
        chip.innerHTML = `
          <div class="sector-chip-left">
            <input type="color" class="sector-color-picker" value="${sectorColors[sec]}" onchange="updateCategoryColor('${sec}', this.value)">
            <span>${sec}</span>
          </div>
        `;
        container.appendChild(chip);
      });
    }

    function updateCategoryColor(sector, newColor) {
      sectorColors[sector] = newColor;
      events.forEach(evt => {
        if (evt.sector === sector) {
          evt.color = newColor;
        }
      });
      renderEventList();
      updateCalendar();
    }

    function saveEvent(e) {
      e.preventDefault();
      const id = document.getElementById('eventId').value;
      const title = document.getElementById('eventTitle').value;
      const date = document.getElementById('eventDate').value;
      const sector = document.getElementById('eventSector').value || 'Generale';
      const color = document.getElementById('eventColor').value;

      if (!sectorColors[sector]) {
        sectorColors[sector] = color;
      }

      if (id) {
        events = events.map(evt => evt.id === id ? { id, title, date, sector, color } : evt);
      } else {
        events.push({ id: Date.now().toString(), title, date, sector, color });
      }

      resetForm();
      updateYearOptions();
      renderSectorLegend();
      renderEventList();
      updateCalendar();
    }

    function editEvent(id) {
      const evt = events.find(e => e.id === id);
      if (!evt) return;
      document.getElementById('eventId').value = evt.id;
      document.getElementById('eventTitle').value = evt.title;
      document.getElementById('eventDate').value = evt.date;
      document.getElementById('eventSector').value = evt.sector || '';
      document.getElementById('eventColor').value = evt.color;
      document.getElementById('formTitle').innerText = "3. Modifica Evento";
    }

    function deleteEvent(id) {
      events = events.filter(e => e.id !== id);
      updateYearOptions();
      renderEventList();
      updateCalendar();
    }

    function clearAllEvents() {
      if (confirm("Sei sicuro di voler rimuovere tutti gli eventi?")) {
        events = [];
        sectorColors = {};
        document.getElementById('sectorLegend').innerHTML = '';
        updateYearOptions();
        renderEventList();
        updateCalendar();
      }
    }

    function resetForm() {
      document.getElementById('eventId').value = '';
      document.getElementById('eventTitle').value = '';
      document.getElementById('eventDate').value = '';
      document.getElementById('eventSector').value = '';
      document.getElementById('eventColor').value = '#2563eb';
      document.getElementById('formTitle').innerText = "3. Aggiungi Evento";
    }

    function renderEventList() {
      const container = document.getElementById('eventListContainer');
      container.innerHTML = '';

      const sorted = [...events].sort((a, b) => a.date.localeCompare(b.date));
      sorted.forEach(evt => {
        const item = document.createElement('div');
        item.className = 'event-item';
        item.innerHTML = `
          <div class="event-info">
            <span style="width:10px; height:10px; border-radius:50%; background:${evt.color}; display:inline-block;"></span>
            <div class="event-text">
              <strong>${evt.title}</strong><br>
              <small style="color:#64748b">${evt.date} (${evt.sector || 'Generale'})</small>
            </div>
          </div>
          <div>
            <button type="button" class="action-btn" onclick="editEvent('${evt.id}')">✎</button>
            <button type="button" class="action-btn delete" onclick="deleteEvent('${evt.id}')">&times;</button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function getGridDimensions(count, orientation) {
      if (count === 12) {
        return orientation === 'landscape' ? { cols: 4, rows: 3 } : { cols: 3, rows: 4 };
      }
      if (count <= 6) {
        return orientation === 'landscape' ? { cols: 3, rows: 2 } : { cols: 2, rows: 3 };
      }
      if (count <= 4) {
        return { cols: 2, rows: 2 };
      }
      if (count <= 8) {
        return orientation === 'landscape' ? { cols: 4, rows: 2 } : { cols: 2, rows: 4 };
      }
      let cols = orientation === 'landscape' ? Math.ceil(Math.sqrt(count * 1.3)) : Math.ceil(Math.sqrt(count * 0.75));
      let rows = Math.ceil(count / cols);
      return { cols, rows };
    }

    // Rendering principale del Calendario
    function updateCalendar() {
      const selectedYearOpt = document.getElementById('yearSelect').value;
      const viewMode = document.getElementById('viewMode').value;
      const monthFilter = document.getElementById('monthFilter').value;
      const pageLayout = document.getElementById('pageLayoutOpt').value;
      const orientation = document.getElementById('pdfOrientation').value;
      const container = document.getElementById('pdfContent');

      container.innerHTML = '';

      let yearsToRender = [];
      const allDetectedYears = [...new Set(events.map(e => e.date.split('-')[0]))].filter(Boolean).sort();

      if (selectedYearOpt === 'all_years') {
        yearsToRender = allDetectedYears.length > 0 ? allDetectedYears : ['2026'];
      } else {
        yearsToRender = [selectedYearOpt || '2026'];
      }

      let itemsToRender = [];

      yearsToRender.forEach(yr => {
        const numericYear = parseInt(yr);
        for (let m = 0; m < 12; m++) {
          const monthStr = String(m + 1).padStart(2, '0');
          const hasEvents = events.some(e => e.date.startsWith(`${yr}-${monthStr}`));
          if (monthFilter === 'all' || hasEvents) {
            itemsToRender.push({ year: numericYear, month: m });
          }
        }
      });

      if (itemsToRender.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding: 40px; color: #64748b; background: white; border-radius: 8px;">Nessun evento trovato per la selezione corrente.</div>`;
        return;
      }

      if (pageLayout === 'multi') {
        itemsToRender.forEach(item => {
          const page = createPdfPage(orientation, false, `Mese: ${monthNames[item.month]} ${item.year}`);
          const monthNode = viewMode === 'grid' ? createGridMonth(item.year, item.month) : createListMonth(item.year, item.month);
          page.appendChild(monthNode);
          container.appendChild(page);
        });
      }
      else if (pageLayout === 'single') {
        const page = createPdfPage(orientation, true, "Pagina Unica - Calendario Completo");
        const gridContainer = createMonthsGridContainer(itemsToRender.length, orientation);

        itemsToRender.forEach(item => {
          const monthNode = viewMode === 'grid' ? createGridMonth(item.year, item.month) : createListMonth(item.year, item.month);
          gridContainer.appendChild(monthNode);
        });

        page.appendChild(gridContainer);
        container.appendChild(page);
      }
      else if (pageLayout === 'dual') {
        const halfCount = Math.ceil(itemsToRender.length / 2);
        const leftItems = itemsToRender.slice(0, halfCount);
        const rightItems = itemsToRender.slice(halfCount);

        // Pagina 1 (Sinistra)
        const page1 = createPdfPage(orientation, true, "Pagina 1 (Sinistra)", "left");
        const grid1 = createMonthsGridContainer(leftItems.length, orientation);
        leftItems.forEach(item => {
          grid1.appendChild(viewMode === 'grid' ? createGridMonth(item.year, item.month) : createListMonth(item.year, item.month));
        });
        page1.appendChild(grid1);
        container.appendChild(page1);

        // Pagina 2 (Destra Speculare)
        if (rightItems.length > 0) {
          const page2 = createPdfPage(orientation, true, "Pagina 2 (Destra)", "right");
          const grid2 = createMonthsGridContainer(rightItems.length, orientation);
          rightItems.forEach(item => {
            grid2.appendChild(viewMode === 'grid' ? createGridMonth(item.year, item.month) : createListMonth(item.year, item.month));
          });
          page2.appendChild(grid2);
          container.appendChild(page2);
        }
      }
    }

    function createPdfPage(orientation, isCompact, watermarkText, side = 'single') {
      const page = document.createElement('div');
      page.className = `pdf-page ${orientation} ${isCompact ? 'compact' : ''} ${side !== 'single' ? 'page-' + side : ''}`;

      const watermark = document.createElement('div');
      watermark.className = 'page-watermark';
      watermark.innerText = watermarkText;
      page.appendChild(watermark);

      return page;
    }

    function createMonthsGridContainer(count, orientation) {
      const grid = document.createElement('div');
      grid.className = 'months-grid';
      const dims = getGridDimensions(count, orientation);
      grid.style.gridTemplateColumns = `repeat(${dims.cols}, 1fr)`;
      grid.style.gridTemplateRows = `repeat(${dims.rows}, 1fr)`;
      return grid;
    }

    function createGridMonth(year, month) {
      const card = document.createElement('div');
      card.className = 'month-card';

      const header = document.createElement('div');
      header.className = 'month-header';
      header.innerText = `${monthNames[month]} ${year}`;
      card.appendChild(header);

      const grid = document.createElement('div');
      grid.className = 'calendar-grid';

      dayNames.forEach(d => {
        const dh = document.createElement('div');
        dh.className = 'day-header';
        dh.innerText = d;
        grid.appendChild(dh);
      });

      const firstDay = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'day-cell';
        emptyCell.style.background = '#f8fafc';
        grid.appendChild(emptyCell);
      }

      for (let day = 1; day <= totalDays; day++) {
        const cell = document.createElement('div');
        cell.className = 'day-cell';

        const dayNum = document.createElement('div');
        dayNum.className = 'day-number';
        dayNum.innerText = day;
        cell.appendChild(dayNum);

        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayEvents = events.filter(e => e.date === dateStr);

        dayEvents.forEach(evt => {
          const tag = document.createElement('div');
          tag.className = 'event-tag';
          tag.style.backgroundColor = evt.color;
          tag.innerText = evt.title;
          cell.appendChild(tag);
        });

        grid.appendChild(cell);
      }

      card.appendChild(grid);
      return card;
    }

    function createListMonth(year, month) {
      const card = document.createElement('div');
      card.className = 'list-view-month';

      const monthStr = String(month + 1).padStart(2, '0');
      const monthEvents = events
        .filter(e => e.date.startsWith(`${year}-${monthStr}`))
        .sort((a, b) => a.date.localeCompare(b.date));

      const header = document.createElement('div');
      header.className = 'list-header-banner';
      header.innerHTML = `
        <span>${monthNames[month]}</span>
        <span class="year-badge">${year}</span>
      `;
      card.appendChild(header);

      const list = document.createElement('ul');
      list.className = 'list-events';

      if (monthEvents.length === 0) {
        const emptyLi = document.createElement('li');
        emptyLi.style.color = '#94a3b8';
        emptyLi.style.fontSize = '0.75rem';
        emptyLi.style.padding = '4px';
        emptyLi.innerText = 'Nessun evento';
        list.appendChild(emptyLi);
      } else {
        monthEvents.forEach(evt => {
          const dateObj = new Date(evt.date);
          const dayNum = evt.date.split('-')[2];
          const dayOfWeek = dayNames[dateObj.getDay()];

          const li = document.createElement('li');
          li.className = 'list-event-item';
          li.innerHTML = `
            <div class="list-day-badge">${dayOfWeek} ${parseInt(dayNum)}</div>
            <div class="list-event-tag" style="background:${evt.color}">
              <span>${evt.title}</span>
              ${evt.sector ? `<span class="list-event-sector-sub">${evt.sector}</span>` : ''}
            </div>
          `;
          list.appendChild(li);
        });
      }

      card.appendChild(list);
      return card;
    }

    function exportToPDF() {
      const element = document.getElementById('pdfContent');
      const yearSelection = document.getElementById('yearSelect').value;
      const orientation = document.getElementById('pdfOrientation').value;
      const pageLayout = document.getElementById('pageLayoutOpt').value;

      const opt = {
        margin: pageLayout === 'multi' ? 8 : 4,
        filename: `Calendario_${yearSelection}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: orientation }
      };

      html2pdf().set(opt).from(element).save();
    }
  </script>
</body>

</html>
